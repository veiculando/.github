name: _angular-ci

# Workflow reutilizavel de CI Angular para os frontends WhiteLabel.
#
# Diferente do BFF, os frontends sao autocontidos: um unico checkout basta.
# O runner e selecionado pelo caller para permitir PRs independentes durante a
# migracao: projetos legados continuam em Karma e os migrados usam Vitest.

on:
  workflow_call:
    inputs:
      node-version:
        description: Versao do Node compativel com o major do Angular.
        type: string
        default: '20'
      working-directory:
        description: Diretorio do projeto Angular dentro do repositorio.
        type: string
        default: '.'
      test-runner:
        description: Runner de testes do projeto (karma ou vitest).
        type: string
        default: 'karma'
      npm-audit-level:
        description: Nivel minimo que reprova o build no npm audit.
        type: string
        default: 'high'
      npm-audit-baseline:
        description: Arquivo versionado com os advisories pre-existentes aceitos.
        type: string
        default: '.github/npm-audit-allowlist.txt'

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Validar runner de testes
        if: inputs.test-runner != 'karma' && inputs.test-runner != 'vitest'
        run: |
          echo "Runner de testes invalido: ${{ inputs.test-runner }}"
          exit 1

      - name: Instalar dependencias
        # npm ci, nunca npm install: respeita o package-lock e falha se ele
        # estiver dessincronizado do package.json, que e o comportamento que se
        # quer num pipeline.
        run: npm ci

      - name: Build
        run: npm run build -- --configuration production

      - name: Testes (Karma)
        if: inputs.test-runner == 'karma'
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: npm test -- --watch=false --browsers=ChromeHeadless --no-progress

      - name: Testes (Vitest)
        if: inputs.test-runner == 'vitest'
        run: npm test -- --watch=false --no-progress

      - name: Auditoria de dependencias
        if: always()
        # O npm nao possui allowlist nativa. A action compara os IDs retornados
        # por npm audit --json com uma baseline versionada e reprova somente
        # advisories novos no nivel configurado.
        uses: veiculando/.github/.github/actions/npm-audit-baseline@main
        with:
          baseline: ${{ inputs.npm-audit-baseline }}
          audit-level: ${{ inputs.npm-audit-level }}
