name: _deploy-vm

# Troca um servico da VM por uma imagem identificada por DIGEST, com gate de
# migracao antes e rollback automatico depois.
#
# Duas regras governam este workflow:
#
# 1. So se aceita digest. Nao ha entrada de tag. Producao roda hoje tags moveis
#    (`homolog-api:gh-20`) e ninguem consegue dizer de qual commit vieram; uma
#    tag tambem pode ser reescrita entre a homologacao e o deploy, e ai o que
#    sobe nao e o que foi aprovado. Digest e imutavel por construcao.
#
# 2. A migracao roda ANTES da troca e reprova a troca se falhar. O deploy que
#    existia antes deste workflow ia direto de `pull` para `up`: uma migracao
#    quebrada seria descoberta pelo usuario, com a imagem nova ja no ar. Falhar
#    aqui deixa producao intacta na versao anterior.
#
# O snapshot do banco (`az sql db copy`) e o unico rollback possivel para dados.
# Rollback de imagem NAO desfaz migracao - por isso migrations retrocompativeis
# sao regra, e quando nao puderem ser, viram duas entregas.

on:
  workflow_call:
    inputs:
      image-name:
        description: Nome do repositorio da imagem dentro do ACR.
        type: string
        required: true
      image-digest:
        description: Digest imutavel a implantar. Formato sha256 seguido de 64 hex.
        type: string
        required: true
      acr-login-server:
        description: Login server do ACR.
        type: string
        required: true
      vm-name:
        description: Nome da VM alvo.
        type: string
        required: true
      resource-group:
        description: Resource group da VM.
        type: string
        required: true
      container-name:
        description: Nome do container a substituir na VM.
        type: string
        required: true
      compose-dir:
        description: Diretorio na VM que contem o compose do stack.
        type: string
        required: true
      image-ref-var:
        description: >-
          Nome da variavel que o compose da VM interpola para este servico.
          O stack de producao usa uma por servico (`API_IMAGE_REF`,
          `FS_IMAGE_REF`) porque tem dois servicos: com nome compartilhado, um
          deploy da API renderizaria o FileServer com a referencia da API.
          Errar aqui NAO falha: o compose cai no default e a run fica verde
          tendo implantado a imagem antiga.
        type: string
        default: IMAGE_REF
      compose-service:
        description: Servico dentro do compose correspondente ao container.
        type: string
        required: true
      health-url:
        description: URL consultada de dentro da VM para aprovar a troca.
        type: string
        required: true
      health-retries:
        description: Tentativas de health antes de declarar falha.
        type: number
        default: 24
      health-interval:
        description: Segundos entre tentativas de health.
        type: number
        default: 5
      run-migrations:
        description: Executa o gate de migracao antes da troca.
        type: boolean
        default: false
      env-file:
        description: >-
          Arquivo de ambiente, relativo a `compose-dir`, que o gate de migracao
          passa ao container descartavel. Exigido quando `run-migrations` e
          verdadeiro; ignorado caso contrario.
          Nao pode ser `required` nem ter default: o GitHub valida inputs
          obrigatorios no startup, antes de qualquer `if`, e um deploy sem
          migracao nem iniciaria. Um default tambem nao serve - era exatamente
          o `.env` fixo que este parametro corrige, e um default errado falha
          igual, so que mais tarde.
        type: string
        default: ''
      migration-command:
        description: Comando de migracao executado dentro da imagem nova.
        type: string
        default: ''
      sql-server:
        description: Servidor SQL logico, para o snapshot pre-migracao.
        type: string
        default: ''
      sql-database:
        description: Banco a copiar antes da migracao.
        type: string
        default: ''
    secrets:
      azure-client-id:
        required: true
      azure-tenant-id:
        required: true
      azure-subscription-id:
        required: true
    outputs:
      previous-digest:
        description: Digest que estava no ar antes da troca.
        value: ${{ jobs.deploy.outputs.previous-digest }}

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    # A extensao run-command aceita UMA execucao por vez por VM. Dois deploys
    # simultaneos na mesma maquina se atropelam, e o que perde relata falha de
    # health - um diagnostico que manda quem investiga para o lugar errado.
    # Com cinco front-ends no pipeline, dois merges proximos ja bastam.
    #
    # `cancel-in-progress: false` de proposito: cancelar um deploy no meio da
    # troca deixa o container em estado indefinido. Eles enfileiram.
    concurrency:
      group: deploy-vm-${{ inputs.resource-group }}-${{ inputs.vm-name }}
      cancel-in-progress: false
    outputs:
      previous-digest: ${{ steps.anterior.outputs.digest }}
    steps:
      - name: Validar o digest
        env:
          DIGEST: ${{ inputs.image-digest }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "::error::Digest invalido: $DIGEST"
            echo "Producao NAO foi tocada."
            exit 1
          fi

      - name: Exigir comando de migracao quando o gate esta ligado
        if: inputs.run-migrations && inputs.migration-command == ''
        run: |
          echo "::error::run-migrations exige migration-command."
          exit 1

      - name: Preparar o invocador de run-command
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/invocar.sh" <<'INVOCADOR'
          #!/usr/bin/env bash
          # Invoca run-command na VM tolerando a serializacao da extensao.
          #
          # A extensao aceita UMA execucao por vez. Qualquer outra invocacao na
          # mesma VM - outro deploy, um agente, uma pessoa no portal - devolve
          # (Conflict) "Run command extension execution is in progress".
          #
          # Sem este laco o conflito aparecia como falha do passo que estivesse
          # rodando. Em 11/09/2026 um deploy do front reprovou em "conferir
          # saude" porque uma consulta paralela segurava a extensao: a mensagem
          # culpava a aplicacao, que nunca chegou a ser consultada. Um
          # diagnostico errado custa mais caro que a falha em si.
          set -uo pipefail

          RG="$1"; VM="$2"; ROTEIRO="$3"
          MAX="${INVOCAR_TENTATIVAS:-10}"

          tentativa=0
          while :; do
            tentativa=$((tentativa + 1))
            saida="$(az vm run-command invoke -g "$RG" -n "$VM" \
              --command-id RunShellScript \
              --scripts "$ROTEIRO" \
              --query "value[0].message" -o tsv 2>&1)"
            rc=$?

            if [ "$rc" -eq 0 ]; then
              printf '%s' "$saida"
              exit 0
            fi

            # So o conflito de concorrencia e retentavel. Falta de permissao ou
            # roteiro invalido nao melhoram com espera, e insistir neles atrasa
            # a falha e esconde a causa.
            if ! printf '%s' "$saida" | grep -qE 'Conflict|execution is in progress'; then
              printf '%s' "$saida" >&2
              exit "$rc"
            fi

            if [ "$tentativa" -ge "$MAX" ]; then
              printf '%s' "$saida" >&2
              echo "::error::A extensao run-command seguiu ocupada apos ${MAX} tentativas." >&2
              exit 1
            fi

            espera=$((tentativa * 6))
            echo "::notice::run-command ocupado em ${VM}; nova tentativa em ${espera}s (${tentativa}/${MAX})" >&2
            sleep "$espera"
          done
          INVOCADOR
          chmod +x "${RUNNER_TEMP}/invocar.sh"
          # Exportado no ambiente porque este workflow nao faz checkout: nao ha
          # arquivo do repositorio para os passos seguintes chamarem.
          echo "INVOCADOR=${RUNNER_TEMP}/invocar.sh" >> "$GITHUB_ENV"

      - name: Login no Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.azure-client-id }}
          tenant-id: ${{ secrets.azure-tenant-id }}
          subscription-id: ${{ secrets.azure-subscription-id }}

      - name: Autenticar a VM no ACR pela identidade gerenciada
        env:
          RG: ${{ inputs.resource-group }}
          VM: ${{ inputs.vm-name }}
          SERVER: ${{ inputs.acr-login-server }}
        run: |
          set -euo pipefail
          # A VM tem AcrPull por RBAC, mas o daemon do docker nao fala RBAC:
          # precisa de `docker login`. Sem este passo o `docker compose pull`
          # abaixo so funciona quando a imagem JA esta em cache local - e a
          # run fica verde escondendo que o pull nunca aconteceu. Foi assim
          # que este defeito apareceu, exercitando o deploy de verdade.
          #
          # O token sai do IMDS e e trocado no proprio ACR. Nao ha segredo no
          # workflow nem no script que o run-command grava em disco na VM:
          # tudo e obtido em tempo de execucao, dentro da maquina.
          roteiro="set -e; T=\$(curl -s -H Metadata:true 'http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https%3A%2F%2Fmanagement.azure.com%2F' | python3 -c 'import sys,json; print(json.load(sys.stdin)[\"access_token\"])'); R=\$(curl -s -X POST -H 'Content-Type: application/x-www-form-urlencoded' -d \"grant_type=access_token&service=${SERVER}&access_token=\$T\" 'https://${SERVER}/oauth2/exchange' | python3 -c 'import sys,json; print(json.load(sys.stdin)[\"refresh_token\"])'); printf '%s' \"\$R\" | docker login '${SERVER}' -u 00000000-0000-0000-0000-000000000000 --password-stdin > /dev/null; echo LOGIN_ACR_OK"
          saida=$(bash "$INVOCADOR" "$RG" "$VM" "$roteiro")
          if ! printf '%s' "$saida" | grep -q LOGIN_ACR_OK; then
            echo "::error::A VM nao conseguiu autenticar no ACR. Confira AcrPull na identidade da VM."
            printf '%s\n' "$saida"
            exit 1
          fi
          echo "VM autenticada em ${SERVER}"

      - name: Registrar o digest atual
        id: anterior
        env:
          RG: ${{ inputs.resource-group }}
          VM: ${{ inputs.vm-name }}
          CONTAINER: ${{ inputs.container-name }}
        run: |
          set -euo pipefail
          # RepoDigests, e nao .Image: o Image ID e local a VM e nao serve para
          # repuxar a imagem anterior num rollback.
          roteiro="docker inspect --format '{{index .RepoDigests 0}}' \$(docker inspect --format '{{.Image}}' ${CONTAINER}) || echo DESCONHECIDO"
          saida=$(bash "$INVOCADOR" "$RG" "$VM" "$roteiro")
          # A referencia COMPLETA (host/repo@digest), nao so o digest: o
          # rollback exporta este valor como imagem no compose, e `sha256:...`
          # sozinho nao e referencia valida. Foi assim que o rollback falhou
          # em silencio no ensaio de 10/09/2026.
          anterior=$(printf '%s' "$saida" | grep -oE '[A-Za-z0-9._:-]+(/[A-Za-z0-9._-]+)+@sha256:[0-9a-f]{64}' | head -1 || true)
          if [ -z "$anterior" ]; then
            echo "::warning::Nao foi possivel determinar o digest atual de ${CONTAINER}."
            echo "::warning::O rollback automatico fica indisponivel neste deploy."
            anterior="DESCONHECIDO"
          fi
          echo "digest=$anterior" >> "$GITHUB_OUTPUT"
          echo "Em producao agora: $anterior"

      - name: Snapshot do banco antes da migracao
        if: inputs.run-migrations && inputs.sql-database != ''
        env:
          RG: ${{ inputs.resource-group }}
          SERVIDOR: ${{ inputs.sql-server }}
          BANCO: ${{ inputs.sql-database }}
        run: |
          set -euo pipefail
          copia="${BANCO}-predeploy-$(date -u +%Y%m%d%H%M%S)"
          echo "Copiando ${BANCO} para ${copia}"
          az sql db copy -g "$RG" -s "$SERVIDOR" -n "$BANCO" --dest-name "$copia"
          echo "::notice::Snapshot ${copia}. Rollback de imagem nao desfaz migracao."

      - name: Gate de migracao
        if: inputs.run-migrations
        env:
          RG: ${{ inputs.resource-group }}
          VM: ${{ inputs.vm-name }}
          REF: ${{ inputs.acr-login-server }}/${{ inputs.image-name }}@${{ inputs.image-digest }}
          COMANDO: ${{ inputs.migration-command }}
          DIR: ${{ inputs.compose-dir }}
          ENVFILE: ${{ inputs.env-file }}
        run: |
          set -euo pipefail
          # `run-migrations` ligado sem `env-file` e erro de quem chama, e
          # precisa reprovar ANTES de tocar a VM - nao virar um "no such file"
          # vindo de dentro do container, que se parece com migracao quebrada.
          if [ -z "${ENVFILE:-}" ]; then
            echo "::error::run-migrations esta ligado mas env-file nao foi informado."
            exit 1
          fi
          # A migracao roda na imagem NOVA, num container descartavel, com o
          # mesmo env-file do stack. Se falhar, este passo falha e nenhum
          # container de producao foi tocado.
          roteiro="set -e; cd '${DIR}'; docker run --rm --env-file '${ENVFILE}' --network host '${REF}' ${COMANDO}; echo MIGRACAO_OK"
          saida=$(bash "$INVOCADOR" "$RG" "$VM" "$roteiro")
          printf '%s\n' "$saida"
          if ! printf '%s' "$saida" | grep -q MIGRACAO_OK; then
            echo "::error::Migracao falhou. Troca abortada, producao intacta."
            exit 1
          fi

      - name: Trocar o container e conferir saude
        id: troca
        env:
          RG: ${{ inputs.resource-group }}
          VM: ${{ inputs.vm-name }}
          REF: ${{ inputs.acr-login-server }}/${{ inputs.image-name }}@${{ inputs.image-digest }}
          DIR: ${{ inputs.compose-dir }}
          SERVICO: ${{ inputs.compose-service }}
          VARIAVEL: ${{ inputs.image-ref-var }}
          URL: ${{ inputs.health-url }}
          TENTATIVAS: ${{ inputs.health-retries }}
          INTERVALO: ${{ inputs.health-interval }}
        run: |
          set -euo pipefail
          # O nome da variavel entra numa string de shell montada aqui, entao
          # precisa ser validado antes: um valor como `X; curl evil` viraria
          # comando rodando como root na VM.
          if ! printf '%s' "$VARIAVEL" | grep -Eq '^[A-Za-z_][A-Za-z0-9_]*$'; then
            echo "::error::image-ref-var invalido: $VARIAVEL"
            exit 1
          fi
          # A variavel e a UNICA coisa que o compose interpola para este
          # servico: o arquivo na VM nao carrega referencia de imagem propria,
          # para que nao exista um segundo lugar de onde uma tag movel reentre.
          roteiro="set -e; cd '${DIR}'; export ${VARIAVEL}='${REF}'; docker compose pull '${SERVICO}'; docker compose up -d --no-deps '${SERVICO}'; i=0; while [ \$i -lt ${TENTATIVAS} ]; do if curl -fsS -o /dev/null '${URL}'; then echo HEALTH_OK; exit 0; fi; i=\$((i+1)); sleep ${INTERVALO}; done; echo HEALTH_FALHOU; exit 1"
          saida=$(bash "$INVOCADOR" "$RG" "$VM" "$roteiro")
          printf '%s\n' "$saida"
          printf '%s' "$saida" | grep -q HEALTH_OK

      - name: Rollback para o digest anterior
        if: failure() && steps.troca.outcome == 'failure' && steps.anterior.outputs.digest != 'DESCONHECIDO'
        env:
          RG: ${{ inputs.resource-group }}
          VM: ${{ inputs.vm-name }}
          ANTERIOR: ${{ steps.anterior.outputs.digest }}
          DIR: ${{ inputs.compose-dir }}
          SERVICO: ${{ inputs.compose-service }}
          CONTAINER: ${{ inputs.container-name }}
          VARIAVEL: ${{ inputs.image-ref-var }}
        run: |
          set -euo pipefail
          echo "::warning::Health reprovou. Voltando para ${ANTERIOR}"
          # O roteiro CONFERE o resultado antes de declarar sucesso. Sem isso o
          # passo mentia: `az vm run-command invoke` devolve exito quando a
          # INVOCACAO funciona, mesmo que o script dentro da VM falhe. No ensaio
          # de 10/09/2026 o rollback relatou sucesso e producao continuou na
          # imagem que acabara de reprovar no health.
          roteiro="set -e; cd '${DIR}'; export ${VARIAVEL}='${ANTERIOR}'; docker compose up -d --no-deps '${SERVICO}'; atual=\$(docker inspect --format '{{.Config.Image}}' '${CONTAINER}'); if [ \"\$atual\" = '${ANTERIOR}' ]; then echo ROLLBACK_OK; else echo \"ROLLBACK_DIVERGENTE atual=\$atual\"; exit 1; fi"
          saida=$(bash "$INVOCADOR" "$RG" "$VM" "$roteiro") || true
          printf '%s\n' "$saida"
          if printf '%s' "$saida" | grep -q ROLLBACK_OK; then
            echo "::error::Health reprovou. Imagem revertida para ${ANTERIOR}. O SCHEMA NAO foi revertido."
          else
            echo "::error::ROLLBACK FALHOU. Producao pode estar na imagem que reprovou no health."
            echo "::error::Intervencao manual: cd ${DIR} && export ${VARIAVEL}='${ANTERIOR}' && docker compose up -d --no-deps ${SERVICO}"
            exit 1
          fi

      - name: Encerrar a sessao do ACR na VM
        # `always()` de proposito: se o deploy falhou e o rollback rodou, a
        # credencial precisa sair do mesmo jeito. `docker login` a grava em
        # /root/.docker/config.json, e deixa-la la e credencial persistente
        # numa maquina onde o run-command ja roda como root.
        if: always()
        env:
          RG: ${{ inputs.resource-group }}
          VM: ${{ inputs.vm-name }}
          SERVER: ${{ inputs.acr-login-server }}
        run: |
          set -euo pipefail
          bash "$INVOCADOR" "$RG" "$VM" "docker logout '${SERVER}' > /dev/null 2>&1; echo LOGOUT_OK" || true
