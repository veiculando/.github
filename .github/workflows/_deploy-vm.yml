name: _deploy-vm

# Troca um servico da VM por uma imagem identificada por DIGEST, com gate de
# migracao antes e rollback automatico depois.
#
# Duas regras governam este workflow:
#
# 1. So se aceita digest. Nao ha entrada de tag. Producao roda hoje tags moveis
#    (`homolog-api:gh-20`) e ninguem consegue dizer de qual commit vieram; uma
#    tag tambem pode ser reescrita entre a homologacao e o deploy, e ai o que
#    sobe nao e o que foi aprovado. Digest e imutavel por construcao.
#
# 2. A migracao roda ANTES da troca e reprova a troca se falhar. O deploy que
#    existia antes deste workflow ia direto de `pull` para `up`: uma migracao
#    quebrada seria descoberta pelo usuario, com a imagem nova ja no ar. Falhar
#    aqui deixa producao intacta na versao anterior.
#
# O snapshot do banco (`az sql db copy`) e o unico rollback possivel para dados.
# Rollback de imagem NAO desfaz migracao - por isso migrations retrocompativeis
# sao regra, e quando nao puderem ser, viram duas entregas.

on:
  workflow_call:
    inputs:
      image-name:
        description: Nome do repositorio da imagem dentro do ACR.
        type: string
        required: true
      image-digest:
        description: Digest imutavel a implantar. Formato sha256 seguido de 64 hex.
        type: string
        required: true
      acr-login-server:
        description: Login server do ACR.
        type: string
        required: true
      vm-name:
        description: Nome da VM alvo.
        type: string
        required: true
      resource-group:
        description: Resource group da VM.
        type: string
        required: true
      container-name:
        description: Nome do container a substituir na VM.
        type: string
        required: true
      compose-dir:
        description: Diretorio na VM que contem o compose do stack.
        type: string
        required: true
      image-ref-var:
        description: >-
          Nome da variavel que o compose da VM interpola para este servico.
          O stack de producao usa uma por servico (`API_IMAGE_REF`,
          `FS_IMAGE_REF`) porque tem dois servicos: com nome compartilhado, um
          deploy da API renderizaria o FileServer com a referencia da API.
          Errar aqui NAO falha: o compose cai no default e a run fica verde
          tendo implantado a imagem antiga.
        type: string
        default: IMAGE_REF
      compose-service:
        description: Servico dentro do compose correspondente ao container.
        type: string
        required: true
      health-url:
        description: URL consultada de dentro da VM para aprovar a troca.
        type: string
        required: true
      health-retries:
        description: Tentativas de health antes de declarar falha.
        type: number
        default: 24
      health-interval:
        description: Segundos entre tentativas de health.
        type: number
        default: 5
      run-migrations:
        description: Executa o gate de migracao antes da troca.
        type: boolean
        default: false
      env-file:
        description: >-
          Arquivo de ambiente, relativo a `compose-dir`, que o gate de migracao
          passa ao container descartavel. Exigido quando `run-migrations` e
          verdadeiro; ignorado caso contrario.
          Nao pode ser `required` nem ter default: o GitHub valida inputs
          obrigatorios no startup, antes de qualquer `if`, e um deploy sem
          migracao nem iniciaria. Um default tambem nao serve - era exatamente
          o `.env` fixo que este parametro corrige, e um default errado falha
          igual, so que mais tarde.
        type: string
        default: ''
      migration-command:
        description: Comando de migracao executado dentro da imagem nova.
        type: string
        default: ''
      sql-server:
        description: Servidor SQL logico, para o snapshot pre-migracao.
        type: string
        default: ''
      sql-database:
        description: Banco a copiar antes da migracao.
        type: string
        default: ''
    secrets:
      azure-client-id:
        required: true
      azure-tenant-id:
        required: true
      azure-subscription-id:
        required: true
    outputs:
      previous-digest:
        description: Digest que estava no ar antes da troca.
        value: ${{ jobs.deploy.outputs.previous-digest }}

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
      previous-digest: ${{ steps.anterior.outputs.digest }}
    steps:
      - name: Validar o digest
        env:
          DIGEST: ${{ inputs.image-digest }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "::error::Digest invalido: $DIGEST"
            echo "Producao NAO foi tocada."
            exit 1
          fi

      - name: Exigir comando de migracao quando o gate esta ligado
        if: inputs.run-migrations && inputs.migration-command == ''
        run: |
          echo "::error::run-migrations exige migration-command."
          exit 1

      - name: Login no Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.azure-client-id }}
          tenant-id: ${{ secrets.azure-tenant-id }}
          subscription-id: ${{ secrets.azure-subscription-id }}

      - name: Registrar o digest atual
        id: anterior
        env:
          RG: ${{ inputs.resource-group }}
          VM: ${{ inputs.vm-name }}
          CONTAINER: ${{ inputs.container-name }}
        run: |
          set -euo pipefail
          # RepoDigests, e nao .Image: o Image ID e local a VM e nao serve para
          # repuxar a imagem anterior num rollback.
          roteiro="docker inspect --format '{{index .RepoDigests 0}}' \$(docker inspect --format '{{.Image}}' ${CONTAINER}) || echo DESCONHECIDO"
          saida=$(az vm run-command invoke -g "$RG" -n "$VM" \
            --command-id RunShellScript \
            --scripts "$roteiro" \
            --query "value[0].message" -o tsv)
          anterior=$(printf '%s' "$saida" | grep -oE 'sha256:[0-9a-f]{64}' | head -1 || true)
          if [ -z "$anterior" ]; then
            echo "::warning::Nao foi possivel determinar o digest atual de ${CONTAINER}."
            echo "::warning::O rollback automatico fica indisponivel neste deploy."
            anterior="DESCONHECIDO"
          fi
          echo "digest=$anterior" >> "$GITHUB_OUTPUT"
          echo "Em producao agora: $anterior"

      - name: Snapshot do banco antes da migracao
        if: inputs.run-migrations && inputs.sql-database != ''
        env:
          RG: ${{ inputs.resource-group }}
          SERVIDOR: ${{ inputs.sql-server }}
          BANCO: ${{ inputs.sql-database }}
        run: |
          set -euo pipefail
          copia="${BANCO}-predeploy-$(date -u +%Y%m%d%H%M%S)"
          echo "Copiando ${BANCO} para ${copia}"
          az sql db copy -g "$RG" -s "$SERVIDOR" -n "$BANCO" --dest-name "$copia"
          echo "::notice::Snapshot ${copia}. Rollback de imagem nao desfaz migracao."

      - name: Gate de migracao
        if: inputs.run-migrations
        env:
          RG: ${{ inputs.resource-group }}
          VM: ${{ inputs.vm-name }}
          REF: ${{ inputs.acr-login-server }}/${{ inputs.image-name }}@${{ inputs.image-digest }}
          COMANDO: ${{ inputs.migration-command }}
          DIR: ${{ inputs.compose-dir }}
          ENVFILE: ${{ inputs.env-file }}
        run: |
          set -euo pipefail
          # `run-migrations` ligado sem `env-file` e erro de quem chama, e
          # precisa reprovar ANTES de tocar a VM - nao virar um "no such file"
          # vindo de dentro do container, que se parece com migracao quebrada.
          if [ -z "${ENVFILE:-}" ]; then
            echo "::error::run-migrations esta ligado mas env-file nao foi informado."
            exit 1
          fi
          # A migracao roda na imagem NOVA, num container descartavel, com o
          # mesmo env-file do stack. Se falhar, este passo falha e nenhum
          # container de producao foi tocado.
          roteiro="set -e; cd '${DIR}'; docker run --rm --env-file '${ENVFILE}' --network host '${REF}' ${COMANDO}; echo MIGRACAO_OK"
          saida=$(az vm run-command invoke -g "$RG" -n "$VM" \
            --command-id RunShellScript \
            --scripts "$roteiro" \
            --query "value[0].message" -o tsv)
          printf '%s\n' "$saida"
          if ! printf '%s' "$saida" | grep -q MIGRACAO_OK; then
            echo "::error::Migracao falhou. Troca abortada, producao intacta."
            exit 1
          fi

      - name: Trocar o container e conferir saude
        id: troca
        env:
          RG: ${{ inputs.resource-group }}
          VM: ${{ inputs.vm-name }}
          REF: ${{ inputs.acr-login-server }}/${{ inputs.image-name }}@${{ inputs.image-digest }}
          DIR: ${{ inputs.compose-dir }}
          SERVICO: ${{ inputs.compose-service }}
          VARIAVEL: ${{ inputs.image-ref-var }}
          URL: ${{ inputs.health-url }}
          TENTATIVAS: ${{ inputs.health-retries }}
          INTERVALO: ${{ inputs.health-interval }}
        run: |
          set -euo pipefail
          # O nome da variavel entra numa string de shell montada aqui, entao
          # precisa ser validado antes: um valor como `X; curl evil` viraria
          # comando rodando como root na VM.
          if ! printf '%s' "$VARIAVEL" | grep -Eq '^[A-Za-z_][A-Za-z0-9_]*$'; then
            echo "::error::image-ref-var invalido: $VARIAVEL"
            exit 1
          fi
          # A variavel e a UNICA coisa que o compose interpola para este
          # servico: o arquivo na VM nao carrega referencia de imagem propria,
          # para que nao exista um segundo lugar de onde uma tag movel reentre.
          roteiro="set -e; cd '${DIR}'; export ${VARIAVEL}='${REF}'; docker compose pull '${SERVICO}'; docker compose up -d --no-deps '${SERVICO}'; i=0; while [ \$i -lt ${TENTATIVAS} ]; do if curl -fsS -o /dev/null '${URL}'; then echo HEALTH_OK; exit 0; fi; i=\$((i+1)); sleep ${INTERVALO}; done; echo HEALTH_FALHOU; exit 1"
          saida=$(az vm run-command invoke -g "$RG" -n "$VM" \
            --command-id RunShellScript \
            --scripts "$roteiro" \
            --query "value[0].message" -o tsv)
          printf '%s\n' "$saida"
          printf '%s' "$saida" | grep -q HEALTH_OK

      - name: Rollback para o digest anterior
        if: failure() && steps.troca.outcome == 'failure' && steps.anterior.outputs.digest != 'DESCONHECIDO'
        env:
          RG: ${{ inputs.resource-group }}
          VM: ${{ inputs.vm-name }}
          ANTERIOR: ${{ steps.anterior.outputs.digest }}
          DIR: ${{ inputs.compose-dir }}
          SERVICO: ${{ inputs.compose-service }}
          VARIAVEL: ${{ inputs.image-ref-var }}
        run: |
          set -euo pipefail
          echo "::warning::Health reprovou. Voltando para ${ANTERIOR}"
          roteiro="set -e; cd '${DIR}'; export ${VARIAVEL}='${ANTERIOR}'; docker compose up -d --no-deps '${SERVICO}'"
          az vm run-command invoke -g "$RG" -n "$VM" \
            --command-id RunShellScript \
            --scripts "$roteiro" \
            --query "value[0].message" -o tsv
          echo "::error::Imagem revertida. O SCHEMA NAO foi revertido."
