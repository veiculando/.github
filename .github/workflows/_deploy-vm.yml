name: _deploy-vm

# Promocao manual por Azure VM Run Command. Nao usa SSH, senha de ACR nem
# GitHub Environment; portanto funciona em repositorios privados no plano Free.

on:
  workflow_call:
    inputs:
      resource-group:
        type: string
        required: true
      vm-name:
        type: string
        required: true
      acr-login-server:
        type: string
        required: true
      vm-identity-client-id:
        type: string
        required: true
      deployment-path:
        type: string
        default: /opt/veiculando
      deploy-bundle-image:
        type: string
        required: true
      core-api-image:
        type: string
        required: true
      bff-image:
        type: string
        required: true
      app-image:
        type: string
        required: true
      exibidora-image:
        type: string
        required: true
      app-hosts:
        type: string
        required: true
      exibidora-hosts:
        type: string
        required: true
      tls-cert-name:
        type: string
        required: true
      rollback-release:
        description: ID exato de release anterior; vazio executa deploy.
        type: string
        default: ''
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true
      CONNECTIONSTRINGS__CNNSTR:
        required: true
      CONNECTIONSTRINGS__BLOBSTORAGECONNSTR:
        required: true
      JWTSETTINGS__SECRET:
        required: true
      GOOGLEMAPS__APIKEY:
        required: true
      VEICULANDO_SENDGRID_API_KEY:
        required: true
      APPLICATIONINSIGHTS__CONNECTIONSTRING:
        required: false
      GITHUB_PAT_INTEGRACAO:
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  preflight:
    uses: veiculando/.github/.github/workflows/_config-preflight.yml@main
    secrets:
      CONNECTIONSTRINGS__CNNSTR: ${{ secrets.CONNECTIONSTRINGS__CNNSTR }}
      CONNECTIONSTRINGS__BLOBSTORAGECONNSTR: ${{ secrets.CONNECTIONSTRINGS__BLOBSTORAGECONNSTR }}
      JWTSETTINGS__SECRET: ${{ secrets.JWTSETTINGS__SECRET }}
      GOOGLEMAPS__APIKEY: ${{ secrets.GOOGLEMAPS__APIKEY }}
      VEICULANDO_SENDGRID_API_KEY: ${{ secrets.VEICULANDO_SENDGRID_API_KEY }}
      APPLICATIONINSIGHTS__CONNECTIONSTRING: ${{ secrets.APPLICATIONINSIGHTS__CONNECTIONSTRING }}
      GITHUB_PAT_INTEGRACAO: ${{ secrets.GITHUB_PAT_INTEGRACAO }}

  deploy:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do bundle versionado
        uses: actions/checkout@v4

      - name: Validar parametros de promocao
        env:
          RESOURCE_GROUP: ${{ inputs.resource-group }}
          VM_NAME: ${{ inputs.vm-name }}
          ACR_LOGIN_SERVER: ${{ inputs.acr-login-server }}
          VM_IDENTITY_CLIENT_ID: ${{ inputs.vm-identity-client-id }}
          DEPLOYMENT_PATH: ${{ inputs.deployment-path }}
          DEPLOY_BUNDLE_IMAGE: ${{ inputs.deploy-bundle-image }}
          CORE_API_IMAGE: ${{ inputs.core-api-image }}
          BFF_IMAGE: ${{ inputs.bff-image }}
          APP_IMAGE: ${{ inputs.app-image }}
          EXIBIDORA_IMAGE: ${{ inputs.exibidora-image }}
          APP_HOSTS: ${{ inputs.app-hosts }}
          EXIBIDORA_HOSTS: ${{ inputs.exibidora-hosts }}
          TLS_CERT_NAME: ${{ inputs.tls-cert-name }}
          ROLLBACK_RELEASE: ${{ inputs.rollback-release }}
        run: |
          set -euo pipefail
          printf '%s' "$RESOURCE_GROUP" | grep -Eq '^[A-Za-z0-9._()/-]+$'
          printf '%s' "$VM_NAME" | grep -Eq '^[A-Za-z0-9._-]+$'
          printf '%s' "$ACR_LOGIN_SERVER" | grep -Eq '^[a-z0-9][a-z0-9.-]*\.azurecr\.io$'
          printf '%s' "$VM_IDENTITY_CLIENT_ID" | grep -Eq '^[0-9a-fA-F-]{36}$'
          printf '%s' "$DEPLOYMENT_PATH" | grep -Eq '^/opt/[A-Za-z0-9._/-]+$'
          printf '%s' "$TLS_CERT_NAME" | grep -Eq '^[A-Za-z0-9._-]+$'
          printf '%s' "$APP_HOSTS" | grep -Eq '^[A-Za-z0-9.* -]+$'
          printf '%s' "$EXIBIDORA_HOSTS" | grep -Eq '^[A-Za-z0-9.* -]+$'

          for image in "$DEPLOY_BUNDLE_IMAGE" "$CORE_API_IMAGE" "$BFF_IMAGE" "$APP_IMAGE" "$EXIBIDORA_IMAGE"; do
            printf '%s' "$image" | grep -Eq '^[a-z0-9.-]+\.azurecr\.io/[a-z0-9._-]+:sha-[0-9a-f]{40}$' || {
              echo "::error::Referencia nao imutavel ou fora do ACR esperado: $image"
              exit 1
            }
            case "$image" in
              "$ACR_LOGIN_SERVER"/*) ;;
              *) echo "::error::Imagem fora do ACR configurado: $image"; exit 1 ;;
            esac
          done

          if [ -n "$ROLLBACK_RELEASE" ]; then
            printf '%s' "$ROLLBACK_RELEASE" | grep -Eq '^[A-Za-z0-9._-]+$' || {
              echo "::error::rollback-release invalida."
              exit 1
            }
          fi

      - name: Login Azure por OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Preparar ambiente cifrado em transito
        id: payload
        if: inputs.rollback-release == ''
        env:
          CORE_API_IMAGE: ${{ inputs.core-api-image }}
          BFF_IMAGE: ${{ inputs.bff-image }}
          APP_IMAGE: ${{ inputs.app-image }}
          EXIBIDORA_IMAGE: ${{ inputs.exibidora-image }}
          APP_HOSTS: ${{ inputs.app-hosts }}
          EXIBIDORA_HOSTS: ${{ inputs.exibidora-hosts }}
          TLS_CERT_NAME: ${{ inputs.tls-cert-name }}
          CONNECTIONSTRINGS__CNNSTR: ${{ secrets.CONNECTIONSTRINGS__CNNSTR }}
          CONNECTIONSTRINGS__BLOBSTORAGECONNSTR: ${{ secrets.CONNECTIONSTRINGS__BLOBSTORAGECONNSTR }}
          JWTSETTINGS__SECRET: ${{ secrets.JWTSETTINGS__SECRET }}
          GOOGLEMAPS__APIKEY: ${{ secrets.GOOGLEMAPS__APIKEY }}
          VEICULANDO_SENDGRID_API_KEY: ${{ secrets.VEICULANDO_SENDGRID_API_KEY }}
          APPLICATIONINSIGHTS__CONNECTIONSTRING: ${{ secrets.APPLICATIONINSIGHTS__CONNECTIONSTRING }}
          GITHUB_PAT_INTEGRACAO: ${{ secrets.GITHUB_PAT_INTEGRACAO }}
        run: |
          set -euo pipefail
          ENV_FILE="$RUNNER_TEMP/production.env"
          : > "$ENV_FILE"

          write_dotenv() {
            key="$1"
            value="$2"
            case "$value" in
              *'
'*) echo "::error::$key contem quebra de linha, formato nao suportado."; exit 1 ;;
            esac
            escaped="$(printf '%s' "$value" | sed "s/'/\\\\'/g")"
            printf "%s='%s'\n" "$key" "$escaped" >> "$ENV_FILE"
          }

          write_dotenv CORE_API_IMAGE "$CORE_API_IMAGE"
          write_dotenv BFF_IMAGE "$BFF_IMAGE"
          write_dotenv APP_IMAGE "$APP_IMAGE"
          write_dotenv EXIBIDORA_IMAGE "$EXIBIDORA_IMAGE"
          write_dotenv APP_HOSTS "$APP_HOSTS"
          write_dotenv EXIBIDORA_HOSTS "$EXIBIDORA_HOSTS"
          write_dotenv TLS_CERT_NAME "$TLS_CERT_NAME"
          write_dotenv CONNECTIONSTRINGS__CNNSTR "$CONNECTIONSTRINGS__CNNSTR"
          write_dotenv CONNECTIONSTRINGS__BLOBSTORAGECONNSTR "$CONNECTIONSTRINGS__BLOBSTORAGECONNSTR"
          write_dotenv JWTSETTINGS__SECRET "$JWTSETTINGS__SECRET"
          write_dotenv GOOGLEMAPS__APIKEY "$GOOGLEMAPS__APIKEY"
          write_dotenv VEICULANDO_SENDGRID_API_KEY "$VEICULANDO_SENDGRID_API_KEY"
          write_dotenv APPLICATIONINSIGHTS__CONNECTIONSTRING "$APPLICATIONINSIGHTS__CONNECTIONSTRING"
          write_dotenv GITHUB_PAT_INTEGRACAO "$GITHUB_PAT_INTEGRACAO"

          chmod 600 "$ENV_FILE"
          echo "env-b64=$(base64 -w0 "$ENV_FILE")" >> "$GITHUB_OUTPUT"

      - name: Executar deploy ou rollback na VM
        env:
          RESOURCE_GROUP: ${{ inputs.resource-group }}
          VM_NAME: ${{ inputs.vm-name }}
          ACR_LOGIN_SERVER: ${{ inputs.acr-login-server }}
          VM_IDENTITY_CLIENT_ID: ${{ inputs.vm-identity-client-id }}
          DEPLOYMENT_PATH: ${{ inputs.deployment-path }}
          DEPLOY_BUNDLE_IMAGE: ${{ inputs.deploy-bundle-image }}
          APP_HOST: ${{ inputs.app-hosts }}
          EXIBIDORA_HOST: ${{ inputs.exibidora-hosts }}
          ROLLBACK_RELEASE: ${{ inputs.rollback-release }}
          ENV_B64: ${{ steps.payload.outputs.env-b64 }}
        run: |
          set -euo pipefail
          RELEASE_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          REMOTE="$RUNNER_TEMP/remote-deploy.sh"

          cat > "$REMOTE" <<EOF
          set -eu
          DEPLOY_ROOT='$DEPLOYMENT_PATH'
          RELEASE_ID='$RELEASE_ID'
          ACR_LOGIN_SERVER='$ACR_LOGIN_SERVER'
          VM_IDENTITY_CLIENT_ID='$VM_IDENTITY_CLIENT_ID'
          ROLLBACK_RELEASE='$ROLLBACK_RELEASE'
          mkdir -p "\$DEPLOY_ROOT/releases" "\$DEPLOY_ROOT/shared/certs"
          az login --identity --client-id "\$VM_IDENTITY_CLIENT_ID" --allow-no-subscriptions >/dev/null
          az acr login --name "${ACR_LOGIN_SERVER%%.*}" >/dev/null

          if [ -n "\$ROLLBACK_RELEASE" ]; then
            DEPLOY_ROOT="\$DEPLOY_ROOT" ROLLBACK_RELEASE="\$ROLLBACK_RELEASE" \
              "\$DEPLOY_ROOT/current/deploy/scripts/rollback.sh"
            exit 0
          fi

          RELEASE_DIR="\$DEPLOY_ROOT/releases/\$RELEASE_ID"
          mkdir -p "\$RELEASE_DIR"
          docker pull '$DEPLOY_BUNDLE_IMAGE' >/dev/null
          bundle_id="\$(docker create '$DEPLOY_BUNDLE_IMAGE')"
          trap 'docker rm -f "\$bundle_id" >/dev/null 2>&1 || true' EXIT
          docker cp "\$bundle_id:/bundle/." "\$RELEASE_DIR/"
          docker rm "\$bundle_id" >/dev/null
          trap - EXIT
          printf '%s' '$ENV_B64' | base64 -d > "\$RELEASE_DIR/.env.production"
          chmod 600 "\$RELEASE_DIR/.env.production"
          DEPLOY_ROOT="\$DEPLOY_ROOT" RELEASE_DIR="\$RELEASE_DIR" \
            APP_HOST='${APP_HOST%% *}' EXIBIDORA_HOST='${EXIBIDORA_HOST%% *}' \
            "\$RELEASE_DIR/deploy/scripts/deploy.sh"
          EOF

          az vm run-command invoke \
            --resource-group "$RESOURCE_GROUP" \
            --name "$VM_NAME" \
            --command-id RunShellScript \
            --scripts @"$REMOTE" \
            --query 'value[0].message' \
            --output tsv

      - name: Logout Azure
        if: always()
        run: az logout >/dev/null 2>&1 || true
